name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: No em or en dashes
        env:
          LC_ALL: C.UTF-8
        run: |
          if grep -rnP '[\x{2013}\x{2014}]' src README.md .github astro.config.mjs; then
            echo "::error::Use a comma, colon, parentheses or a hyphen instead of an em or en dash."
            exit 1
          fi

      # The links validator runs as part of the build and fails it on any broken
      # internal link or #anchor.
      - name: Build and check links
        run: npm run build
